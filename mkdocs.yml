site_name: Docs as Code

theme:
  name: readthedocs

nav:
  - Главная: index.md
  - Проект:
      - Описание: project/overview.md
      - Функциональные требования: project/requirements.md
      - Диаграммы: project/diagrams.md
      - Документация API: api/index.md

plugins:
  - search
  - swagger-ui-tag:
      docExpansion: list
      filter: true
      syntaxHighlightTheme: monokai
      tryItOutEnabled: false

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format